<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monique's World</title>
  <style>
   @import url('https://fonts.googleapis.com/css2?family=Aeonik:wght@400;700&display=swap');

   body {
  margin: 0;
  font-family: 'Aenok', sans-serif; /* custom font */
  background-color: #F8F8F8;        /* light background */
  color: #222222;                   /* dark gray text */
}

header {
display: flex;
justify-content: space-between;
align-items: center;
padding: 20px 60px;
background-color: #F8F8F8;
}

.logo {
font-size: 2rem;
font-weight: 700;
color: #222222;
letter-spacing: 2px;
}

.nav-right {
display: flex;
align-items: center;
gap: 25px;
}

.nav-right a {
color: #222222;
text-decoration: none;
font-weight: 500;
transition: 0.3s;
}

.nav-right a:hover {
color: #000;
}

.connect-btn {
border: 2px solid #222222;
padding: 8px 18px;
border-radius: 25px;
font-weight: bold;
background: none;
cursor: pointer;
transition: 0.3s;
}

.connect-btn:hover {
background-color: #222222;
color: #F8F8F8;
}


    .left-section {
      display: flex;
      flex-direction: column;
      flex: 0 0 auto;
      padding-top: 20px;
    }

  

  </style>
</head>
<body>
 <header>
<div class="logo">M.</div>

<nav class="nav-right">
<a href="#">About Me</a>
