<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iKon is coming to town</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #000000;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* NAVBAR */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 170px;
      background-color: #000000;
      padding: 0 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }

    .logo {
      cursor: pointer;
    }

    .logo img {
      height: 200px;
      width: auto;
      display: block;
      transition: all 0.3s ease;
    }

    .logo:hover img {
      transform: scale(1.08);
    }

    .nav-links {
      display: flex;
      gap: 40px;
      list-style: none;
    }

    .nav-links a {
      color: #ffffff;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      position: relative;
      letter-spacing: 1px;
    }

    .nav-links a:hover {
      color: #8B0000;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, #8B0000, #ffffff);
      transition: width 0.3s ease;
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    /* HERO SECTION */
    .hero {
      height: 100vh;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin-top: 170px;
      position: relative;
      overflow: hidden;
    }

    .hero-content {
      z-index: 10;
      animation: fadeInUp 1s ease-out;
    }

    .hero p {
      font-size: 1.8rem;
      color: #00ffff;
      margin-bottom: 50px;
      font-weight: 300;
      font-family: 'Courier New', monospace;
      letter-spacing: 2px;
      animation: staticGlitch 1.5s ease-in-out infinite;
      position: relative;
      filter: contrast(1.1) brightness(1.05);
      text-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
    }

    @keyframes staticGlitch {
      0%, 100% {
        text-shadow:
          0 0 0 rgba(0, 255, 255, 0),
          0 0 0 rgba(255, 51, 51, 0),
          0 0 0 rgba(255, 215, 0, 0),
          0 0 15px rgba(0, 255, 255, 0.6);
        transform: translate(0);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      }

      10% {
        text-shadow:
          -3px 0 0 #FF3333,
          3px 0 0 #00ffff,
          -1px 1px 0 #FFD700,
          0 0 20px rgba(255, 51, 51, 0.5);
        transform: translate(-2px, 1px);
      }

      20% {
        text-shadow:
          5px 0 0 #00ffff,
          -5px 0 0 #FF3333,
          2px -2px 0 #FFD700,
          0 0 25px rgba(0, 255, 255, 0.6);
        transform: translate(3px, -1px);
      }

      30% {
        text-shadow:
          -4px 0 0 #FFD700,
          4px 0 0 #FF3333,
          -2px 2px 0 #00ffff,
          0 0 30px rgba(255, 215, 0, 0.5);
        transform: translate(-3px, 2px);
      }

      40% {
        text-shadow:
          -6px 0 0 #00ffff,
          6px 0 0 #FFD700,
          3px 3px 0 #FF3333,
          0 0 35px rgba(255, 51, 51, 0.6);
        transform: translate(4px, -2px);
      }

      50% {
        text-shadow:
          2px 0 0 #FF3333,
          -2px 0 0 #00ffff,
          0 2px 0 #FFD700,
          0 0 25px rgba(0, 255, 255, 0.5);
        transform: translate(1px, 1px);
      }

      60% {
        text-shadow:
          -5px 0 0 #FFD700,
          5px 0 0 #FF3333,
          -3px 1px 0 #00ffff,
          0 0 28px rgba(255, 215, 0, 0.5);
        transform: translate(-4px, 1px);
      }

      70% {
        text-shadow:
          4px 0 0 #00ffff,
          -4px 0 0 #FF3333,
          2px -1px 0 #FFD700,
          0 0 32px rgba(0, 255, 255, 0.6);
        transform: translate(3px, -1px);
      }

      80% {
        text-shadow:
          -3px 0 0 #FF3333,
          3px 0 0 #FFD700,
          1px 1px 0 #00ffff,
          0 0 20px rgba(255, 51, 51, 0.5);
        transform: translate(-2px, 0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      nav {
        height: 150px;
        padding: 0 20px;
        flex-direction: column;
        justify-content: center;
        gap: 15px;
      }

      .logo img {
        height: 80px;
      }

      .nav-links {
        gap: 15px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .nav-links a {
        font-size: 0.75rem;
      }

      .hero {
        margin-top: 150px;
        padding: 20px;
      }

      .hero p {
        font-size: 1.2rem;
        letter-spacing: 1px;
        margin-bottom: 30px;
      }
    }

    @media (max-width: 480px) {
      nav {
        height: 130px;
        padding: 0 15px;
      }

      .logo img {
        height: 60px;
      }

      .nav-links {
        gap: 10px;
      }

      .nav-links a {
        font-size: 0.65rem;
      }

      .hero {
        margin-top: 130px;
      }

      .hero p {
        font-size: 1rem;
        letter-spacing: 0.5px;
      }
    }
  </style>
</head>

<body>
  <!-- NAVBAR -->
  <nav>
    <div class="logo" onclick="document.querySelector('.hero').scrollIntoView()">
      <img src="ikon.jpg" alt="iKON Logo">
    </div>

    <ul class="nav-links">
      <li><a href="aboutikon.html">About</a></li>
      <li><a href="members.html">Members</a></li>
      <li><a href="timeline.html">Timeline</a></li>
      <li><a href="discography.html">Discography</a></li>
      <li><a href="videography.html">Videography</a></li>
      <li><a href="gallery.html">Gallery</a></li>
    </ul>
  </nav>

  <!-- HERO SECTION -->
  <section class="hero">
    <div class="hero-content">
      <p>The Legends Continue</p>
    </div>
  </section>
</body>
</html>
