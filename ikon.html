<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hardcoded Dark Page</title>
  <style>
    body {
      background-color: #222222; /* dark gray background */
      color: #ffffff;            /* white text for readability */
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px;
      text-align: center;
    }

    .logo {
      display: inline-block;
      margin-bottom: 20px;
    }

    .stripe {
      width: 60px;
      height: 10px;
      background-color: #000000;
      margin: 5px 0;
      transform: skew(-20deg);
    }
  </style>
</head>
<body>
  <div class="logo">
    <div class="stripe"></div>
    <div class="stripe"></div>
    <div class="stripe"></div>
    <div class="stripe"></div>
    <div class="stripe"></div>
  </div>

  <h1>Hello, Monique!</h1>
  <p>This page has a hardcoded #222222 background with a simple stripe logo.</p>
</body>
</html>
