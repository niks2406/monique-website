<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>iKon is coming to town</title>
  <style>
    body {
      background-color: #222222;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 30px;
    }

    h1 {
      text-align: left; /* align left */
    }

    /* Rectangle / stripe style */
    .rectangle {
      width: 15px;
      height: 60px;
      background-color: #ffffff; /* white rectangle */
      transform: skew(-20deg);   /* slant effect */
      margin-top: -10px;
    }

    /* Container to hold rectangles side by side */
    .logo {
      display: flex;
      gap: 10px; /* space between rectangles */
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="rectangle"></div>
      <div class="rectangle"></div> <!-- second rectangle on the right -->
    </div>
  </header>
</body>
</html>
