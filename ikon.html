<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hardcoded Logo Page</title>
  <style>
    body {
      background-color: #222222;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .logo {
      display: flex;
      flex-direction: row;
      gap: 5px;
    }

    .stripe {
      width: 10px;
      height: 60px;
      background-color: #ffffff;
      transform: skew(-20deg);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="stripe"></div>
      <div class="stripe"></div>
      <div class="stripe"></div>
      <div class="stripe"></div>
      <div class="stripe"></div>
      <div class="stripe"></div>
      <div class="stripe"></div>
    </div>
    <h1>Hello, Monique!</h1>
  </div>

  <p>This page has a hardcoded #222222 background with a stripe logo.</p>
</body>
</html>
