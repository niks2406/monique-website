<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monique's World</title>
  <style>
   @import url('https://fonts.googleapis.com/css2?family=Aeonik:wght@400;700&display=swap');

   body {
  margin: 0;
  font-family: 'Aenok', sans-serif; /* custom font */
  background-color: #F8F8F8;        /* light background */
  color: #222222;                   /* dark gray text */
}

header {
display: flex;
justify-content: space-between;
align-items: center;
padding: 20px 60px;
background-color: #F8F8F8;
}

.logo {
font-size: 2rem;
font-weight: 700;
color: #222222;
letter-spacing: 2px;
}

.nav-right {
display: flex;
align-items: center;
gap: 25px;
}

.nav-right a {
color: #222222;
text-decoration: none;
font-weight: 500;
transition: 0.3s;
}

.nav-right a:hover {
color: #000;
}

.connect-btn {
border: 2px solid #222222;
padding: 8px 18px;
border-radius: 25px;
font-weight: bold;
background: none;
cursor: pointer;
transition: 0.3s;
}

.connect-btn:hover {
background-color: #222222;
color: #F8F8F8;
}

    .hero {
      display: flex;
      gap: 80px;
      padding: 60px 80px;
      min-height: 80vh;
      align-items: flex-start;
    }

    .left-section {
      display: flex;
      flex-direction: column;
      flex: 0 0 auto;
      padding-top: 20px;
    }

    .hello-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 8rem;
      font-weight: 300;
      line-height: 0.9;
      margin: 0 0 -10px 0;
    }

    .hero-text {
      max-width: 500px;
      margin-top: 0;
    }

    .typewriter {
      font-size: 1.1rem;
      margin: 10px 0 0 0;
      font-weight: 400;
      font-family: Arial, sans-serif;
      display: inline-block;
      overflow: hidden;
      border-right: 3px solid #222222;
      white-space: nowrap;
      animation: typing 5s steps(45, end), blink 0.7s step-end infinite;
      color: #222222;
    }

    @keyframes typing {
      from {
        width: 0;
      }
      to {
        width: 100%;
      }
    }

    @keyframes blink {
      0%, 49%, 100% {
        border-right-color: #222222;
      }
      50%, 99% {
        border-right-color: transparent;
      }
    }

    .tagline {
      font-size: 1.1rem;
      margin: 10px 0 30px 0;
      color: #555;
    }

    .hero p {
      font-size: 1.1rem;
      margin: 0 0 30px 0;
      color: #555;
    }

    .stats {
      display: flex;
      gap: 80px;
      margin: 0;
    }

    .stats div {
      font-size: 1rem;
      font-weight: 600;
    }

    .stats div span {
      display: block;
      font-size: 0.9rem;
      font-weight: 400;
      color: #999;
      margin-top: 5px;
    }

    .hero-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      flex: 1;
      padding-top: 20px;
    }

    .hero img {
      width: 350px;
      height: auto;
      border-radius: 8px;
      flex: 0 0 auto;
    }

    .vertical-text {
      position: fixed;
      left: 30px;
      top: 50%;
      transform: translateY(-50%);
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: 0.85rem;
      color: #999;
      letter-spacing: 2px;
    }

    .scroll-down {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #999;
    }
  </style>
</head>
<body>
 <header>
<div class="logo">M.</div>

<nav class="nav-right">
<a href="#">About Me</a>
<a href="#">Portfolio</a>
<a href="#">Travel</a>
<a href="#">Blog</a>
<a href="/ikon.html">iKON Archive</a>
<a href="#" class="connect-btn">Let's Connect ↗</a>
</nav>
</header>

<div class="vertical-text">Featured designs</div>

  <section class="hero">
    <div class="left-section">
      <div class="hello-text">Hello</div>
      <div class="hero-text">
        <p class="typewriter">It's Monique — learning never goes out of style</p>
        <div class="stats">
          <div>+200 <span>Project completed</span></div>
          <div>+50 <span>Startup raised</span></div>
        </div>
      </div>
    </div>

    <div class="hero-center">
      <img src="portrait.png" alt="Portrait - Monique">
      <div class="scroll-down">Scroll down ↓</div>
    </div>
  </section>

 
</body>
</html>
