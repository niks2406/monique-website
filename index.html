<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monique's World</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #F8F8F8;
      color: #000;
    }

    
   header {
  display: flex;
  justify-content: flex-end; /* push everything to the right */
  padding: 20px 50px;
}

.nav-right a {
  margin: 0 15px;
  text-decoration: none;
  color: #000;
  font-weight: 500;
}

.connect-btn {
  border: 2px solid #000;   /* rectangular outline */
  padding: 8px 16px;
  border-radius: 4px;       /* optional rounded corners */
  font-weight: bold;
}
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 80px 20px;
    }
    .hero img {
      width: 250px;
      border-radius: 5px;
      margin-bottom: 30px;
    }
    .hero h1 {
      font-size: 2.5rem;
      margin: 10px 0;
    }
    .hero p {
      font-size: 1.2rem;
      margin: 5px 0;
    }
    .stats {
      display: flex;
      gap: 40px;
      margin: 30px 0;
    }
    .stats div {
      font-size: 1rem;
      font-weight: bold;
    }
   
    .vertical-text {
      position: fixed;
      left: 20px;
      bottom: 50px;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: 0.9rem;
      color: #555;
    }
    .scroll-down {
      margin-top: 50px;
      font-size: 0.9rem;
      color: #555;
    }
  </style>
</head>
<body>
  <header>
    <nav clas="nav-right">
      <a href="#">About Me</a>
      <a href="#">Portfolio</a>
      <a href="#">Travel</a>
      <a href="#">Blog</a>
       <a href="#">iKOn Archive</a>
       <a href="#" class="connect-btn">Let's Connect ↗</a>
    </nav>
  </header>

  <section class="hero">
    <img src="portrait.png" alt="insert here Portrait">
    <h1>Hello — It’s Monique</h1>
    <p>a design wizard</p>
    <div class="stats">
      <div>+200 Project completed</div>
      <div>+50 Startup raised</div>
    </div>
    <div class="scroll-down">Scroll down ↓</div>
  </section>

 
</body>
</html>
