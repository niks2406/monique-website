<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D.Nova Portfolio</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #fff;
      color: #000;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 50px;
    }
    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: #000;
      font-weight: 500;
    }
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 80px 20px;
    }
    .hero img {
      width: 250px;
      border-radius: 5px;
      margin-bottom: 30px;
    }
    .hero h1 {
      font-size: 2.5rem;
      margin: 10px 0;
    }
    .hero p {
      font-size: 1.2rem;
      margin: 5px 0;
    }
    .stats {
      display: flex;
      gap: 40px;
      margin: 30px 0;
    }
    .stats div {
      font-size: 1rem;
      font-weight: bold;
    }
    .cta {
      margin-top: 20px;
    }
    .cta a {
      text-decoration: none;
      background: #000;
      color: #fff;
      padding: 12px 25px;
      border-radius: 4px;
      font-weight: bold;
    }
    .vertical-text {
      position: fixed;
      left: 20px;
      bottom: 50px;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: 0.9rem;
      color: #555;
    }
    .scroll-down {
      margin-top: 50px;
      font-size: 0.9rem;
      color: #555;
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="#">About Me</a>
      <a href="#">Portfolio</a>
      <a href="#">Services</a>
      <a href="#">Blog</a>
    </nav>
    <div class="cta">
      <a href="#">Book A Call ↗</a>
    </div>
  </header>

  <section class="hero">
    <img src="portrait.png" alt="D.Nova Portrait">
    <h1>Hello — It’s D.Nova</h1>
    <p>a design wizard</p>
    <div class="stats">
      <div>+200 Project completed</div>
      <div>+50 Startup raised</div>
    </div>
    <div class="scroll-down">Scroll down ↓</div>
  </section>

  <div class="vertical-text">
    Product designer<br>2024
  </div>
</body>
</html>
