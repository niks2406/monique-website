<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monique's World</title>
  <style>
   body {
  margin: 0;
  font-family: 'Aenok', sans-serif; /* custom font */
  background-color: #F8F8F8;        /* light background */
  color: #222222;                   /* dark gray text */
}

header {
display: flex;
justify-content: space-between;
align-items: center;
padding: 20px 60px;
background-color: #F8F8F8;
}

.logo {
font-size: 2rem;
font-weight: 700;
color: #222222;
letter-spacing: 2px;
}

.nav-right {
display: flex;
align-items: center;
gap: 25px;
}

.nav-right a {
color: #222222;
text-decoration: none;
font-weight: 500;
transition: 0.3s;
}

.nav-right a:hover {
color: #000;
}

.connect-btn {
border: 2px solid #222222;
padding: 8px 18px;
border-radius: 25px;
font-weight: bold;
background: none;
}


    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 80px 30px;
    }
    .hero img {
      width: 420px;
      border-radius: 5px;
      margin-bottom: 30px;
    }
    .hero h1 {
      font-size: 2.5rem;
      margin: 10px 0;
    }
    .hero p {
      font-size: 1.2rem;
      margin: 5px 0;
    }

    .hero-text{
      max-width:600px;
    }

  .hello-text{
    font-family: 'Neue Montreal', sans-serif;
    font-size: 9rem
    font-weight: 300;
  }
    
    .stats {
      display: flex;
      gap: 40px;
      margin: 30px 0;
    }
    .stats div {
      font-size: 1rem;
      font-weight: bold;
    }
   
    .vertical-text {
      position: fixed;
      left: 20px;
      bottom: 50px;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: 0.9rem;
      color: #555;
    }
    .scroll-down {
      margin-top: 50px;
      font-size: 0.9rem;
      color: #555;
    }
  </style>
</head>
<body>
 <header>
<div class="logo">M.</div>

<nav class="nav-right">
<a href="#">About Me</a>
<a href="#">Portfolio</a>
<a href="#">Travel</a>
<a href="#">Blog</a>
<a href="#">iKON Archive</a>
<a href="#" class="connect-btn">Let's Connect ↗</a>
</nav>
</header>


  <section class="hero">
     <div class="hello-text">Hello
       </div>
   <div class="hero-text">
    <h1>It's Monique</h1>
    <p>learning never goes out of style</p>
    <div class="stats">
      <div>+200 Project completed</div>
      <div>+50 Startup raised</div>
    </div>
      <img src="portrait.png" alt="insert here Portrait">
    <div class="scroll-down">Scroll down ↓</div>
  </section>

 
</body>
</html>
